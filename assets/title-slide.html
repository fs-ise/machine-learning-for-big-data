<section id="$idprefix$title-slide" style="--title-slide-background: url('$title-slide-image$');" $for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <div class="title-slide-content">
    <h1 class="title">$title$</h1>
$if(subtitle)$
    <p class="subtitle">$subtitle$</p>
$endif$
$if(date)$
    <p class="date">$date$</p>
$endif$
  </div>
</section>
