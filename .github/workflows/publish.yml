name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R and system libraries
        run: |
          sudo apt-get update
          # tidyverse and its graphics/networking dependencies compile against
          # these headers when CRAN binaries are unavailable.
          sudo apt-get install --yes --no-install-recommends \
            r-base \
            r-base-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libicu-dev \
            libssl-dev \
            libxml2-dev
          mkdir -p "$HOME/R/library"
          export R_LIBS_USER="$HOME/R/library"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
      - name: Install and validate R rendering dependencies
        run: |
          Rscript scripts/install_r_dependencies.R
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Render site and exercise artifacts
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
