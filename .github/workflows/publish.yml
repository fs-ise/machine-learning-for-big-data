name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R exercise dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes r-base
          mkdir -p "$HOME/R/library"
          export R_LIBS_USER="$HOME/R/library"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          Rscript -e 'install.packages(c(
            "tidyverse",
            "tidymodels",
            "pROC",
            "quanteda",
            "irlba",
            "glmnet",
            "kknn",
            "rpart",
            "ranger",
            "kernlab"
          ), repos = "https://cloud.r-project.org")'
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Validate all generated exercise variants
        run: make exercises-check
      - run: make site-fast
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
